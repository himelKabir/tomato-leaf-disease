[project]
name = "tomato-leaf-check"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.4",
    "torchvision>=0.19",
]

[tool.uv]
package = false

# Vercel runs on CPU. Keep CUDA libraries out of the deployment bundle.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.vercel]
entrypoint = "index:app"
