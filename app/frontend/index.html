<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Check a photo of a tomato leaf for disease: the disease name, the confidence, the affected area and what to do." />
    <meta name="theme-color" content="#059669" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Tomato Leaf Check</title>
    <script>
      // Set the theme before the page draws, so it does not flash light first.
      var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
      try {
        var saved = localStorage.getItem('theme')
        if (saved) dark = saved === 'dark'
      } catch (e) {}
      document.documentElement.classList.toggle('dark', dark)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
